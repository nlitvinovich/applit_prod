name: Auto Update Products

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # ← ДАЁТ ПРАВО PUSH ДЛЯ GITHUB ACTIONS

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # ← важно

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"   # ← Node 24, без deprecated

      - name: Install Python dependencies
        run: pip install telethon

      - name: Restore session + run Telethon export
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python pipeline.py

      - name: Run generator
        run: node admin/generator.js

      - name: Auto commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update products.csv"
          file_pattern: products.csv
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
