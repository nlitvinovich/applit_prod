name: Auto Update Products

on:
  schedule:
    - cron: "0 * * * *"   # запуск каждый час
  workflow_dispatch:       # ручной запуск

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install telethon

      - name: Restore session + run Telethon export
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}   # invite-link канала
        run: python pipeline.py

      - name: Run generator
        run: node admin/generator.js

      - name: Auto commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update products.csv"
          file_pattern: products.csv
