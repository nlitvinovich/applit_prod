name: Telegram → CSV Generator

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # запуск каждые 30 минут

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # используем PAT вместо GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telethon
        run: pip install telethon

      - name: Run Telegram pipeline
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python pipeline.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run generator
        run: node admin/generator.js

      - name: Commit updated CSV
        run: |
          git config user.name "Mikolay"
          git config user.email "ТВОЙ_EMAIL_ИЗ_GITHUB"   # замени на свой
          git add products.csv
          git commit -m "Update products.csv" || echo "No changes"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/nlitvinovich/applit_test.git

      - name: Keep‑alive commit
        run: |
          echo "Last keep‑alive: $(date)" > .keepalive
          git config user.name "Mikolay"
          git config user.email "ТВОЙ_EMAIL_ИЗ_GITHUB"   # замени на свой
          git add .keepalive
          git commit -m "Keep‑alive commit" || echo "No changes"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/nlitvinovich/applit_test.git
