name: Telegram → CSV Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telethon
        run: pip install telethon

      - name: Run Telegram pipeline
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python pipeline.py

      - name: Upload input.txt
        uses: actions/upload-artifact@v4
        with:
          name: telegram-input
          path: admin/input.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run generator
        run: node admin/generator.js

      - name: Upload products.csv
        uses: actions/upload-artifact@v4
        with:
          name: products-csv
          path: products.csv
